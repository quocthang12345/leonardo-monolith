name: Leonardo CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  
jobs:
  maven_build_and_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: "maven"

      - name: Provide permission to mvnw executable
        run: chmod +x mvnw

      - name: Build and Test with Maven
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: ./mvnw clean package -B -Dspring.profiles.active=ci

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/'

      - name: Upload Jar file
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: leonardo
          path: 'leonardo/target/*.jar'

      - name: Notify workflow
        if: ${{ always() }}
        run: echo "${{ secrets.MAIL_USERNAME }} and ${{ secrets.MAIL_PASSWORD }}"

  docker_build_and_test:
    runs-on: ubuntu-latest
    needs: [maven_build_and_test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: leonardo
          path: 'leonardo/target/'

      - name: Build Docker Image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./leonardo/Dockerfile
          load: true # This moves the image to the runner's local 'docker images'
          push: false # Do NOT push yet
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/leonardo:latest

      - name: Verify docker image
        run: |
          echo "Testing Docker image for leonardo"
          docker images ${{ secrets.DOCKERHUB_USERNAME }}/leonardo:latest
          echo "Docker image for leonardo built successfully"

  docker_build_and_push:
    runs-on: ubuntu-latest
    needs: [docker_build_and_test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: leonardo
          path: ./leonardo/target

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./leonardo/Dockerfile
          load: true
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/leonardo:latest

      - name: Notify successfully
        run: echo "Push successfully"
